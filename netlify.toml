[build]
  publish = "dist"
  command = "npm run build"

# Root path — the actual URL users request. This is the critical rule.
# Previously only /index.html was targeted, which never matched because
# browsers request / not /index.html. Fixed April 2026.
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Also target /index.html for SPA deep-link redirects that resolve this path
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# version.json — must never be cached, used for auto-reload detection
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Hashed assets (JS/CSS bundles) are safe to cache forever —
# Vite gives each build a unique filename, so stale cache is never an issue
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — all routes serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
