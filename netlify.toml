[build]
  publish = "dist"
  command = "npm run build"

# Never cache the service worker or entry point — browsers must always re-fetch
# these to detect new deploys
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"

# Hashed assets (JS/CSS bundles) are safe to cache forever —
# Vite gives each build a unique filename, so stale cache is never an issue
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback — all routes serve index.html
# EXCEPT for bots: the prerender extension intercepts crawlers before this rule applies
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { User-agent = ["!Googlebot", "!Bingbot", "!Slurp", "!DuckDuckBot", "!Baiduspider", "!YandexBot", "!Applebot"] }
